<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38BDF8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34D399" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .cell-txt { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; dominant-baseline: central; }
    .star-txt { font-family: 'Fira Code', monospace; font-size: 18px; font-weight: 900; fill: #FBBF24; text-anchor: middle; dominant-baseline: central; }
    .col-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #38BDF8; text-anchor: middle; }
    .row-lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #34D399; }
  </style>

  <rect width="900" height="500" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="title">MA TRẬN LƯỚI 2D: VÒNG LẶP LỒNG NHAU (NESTED LOOPS)</text>
    <text x="0" y="24" class="subtitle">Vòng ngoài điều khiển HÀNG (i) — Vòng trong điều khiển CỘT (j)</text>
  </g>

  <!-- COLUMN HEADERS (j) -->
  <g transform="translate(230, 85)">
    <text x="50" y="0" class="col-lbl">CỘT 0 (j=0)</text>
    <text x="165" y="0" class="col-lbl">CỘT 1 (j=1)</text>
    <text x="280" y="0" class="col-lbl">CỘT 2 (j=2)</text>
    <text x="395" y="0" class="col-lbl">CỘT 3 (j=3)</text>
  </g>

  <!-- ROW 0 (i=0) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <!-- Row Header -->
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1.2" />
    <text x="20" y="32" class="row-lbl">HÀNG 0 (i = 0)</text>
    <text x="20" y="52" font-family="system-ui" font-size="11" fill="#6EE7B7">Vòng ngoài lượt 1</text>

    <!-- Arrow from row to cells -->
    <path d="M 160 37 L 180 37" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)" />

    <!-- 4 Cells -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="50" y="26" class="star-txt">★</text>
      <text x="50" y="52" class="cell-txt">(0, 0)</text>

      <rect x="115" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="165" y="26" class="star-txt">★</text>
      <text x="165" y="52" class="cell-txt">(0, 1)</text>

      <rect x="230" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="280" y="26" class="star-txt">★</text>
      <text x="280" y="52" class="cell-txt">(0, 2)</text>

      <rect x="345" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="395" y="26" class="star-txt">★</text>
      <text x="395" y="52" class="cell-txt">(0, 3)</text>

      <!-- Print Newline badge -->
      <path d="M 450 37 L 480 37" fill="none" stroke="#A855F7" stroke-width="2" />
      <rect x="485" y="22" width="115" height="30" rx="6" fill="#581C87" stroke="#A855F7" />
      <text x="542" y="37" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle" dominant-baseline="central">print() ↵</text>
    </g>
  </g>

  <!-- ROW 1 (i=1) -->
  <g transform="translate(40, 195)" filter="url(#shadow)">
    <!-- Row Header -->
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1.2" />
    <text x="20" y="32" class="row-lbl">HÀNG 1 (i = 1)</text>
    <text x="20" y="52" font-family="system-ui" font-size="11" fill="#6EE7B7">Vòng ngoài lượt 2</text>

    <path d="M 160 37 L 180 37" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)" />

    <!-- 4 Cells -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="50" y="26" class="star-txt">★</text>
      <text x="50" y="52" class="cell-txt">(1, 0)</text>

      <rect x="115" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="165" y="26" class="star-txt">★</text>
      <text x="165" y="52" class="cell-txt">(1, 1)</text>

      <rect x="230" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="280" y="26" class="star-txt">★</text>
      <text x="280" y="52" class="cell-txt">(1, 2)</text>

      <rect x="345" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="395" y="26" class="star-txt">★</text>
      <text x="395" y="52" class="cell-txt">(1, 3)</text>

      <!-- Print Newline badge -->
      <path d="M 450 37 L 480 37" fill="none" stroke="#A855F7" stroke-width="2" />
      <rect x="485" y="22" width="115" height="30" rx="6" fill="#581C87" stroke="#A855F7" />
      <text x="542" y="37" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle" dominant-baseline="central">print() ↵</text>
    </g>
  </g>

  <!-- ROW 2 (i=2) -->
  <g transform="translate(40, 285)" filter="url(#shadow)">
    <!-- Row Header -->
    <rect x="0" y="0" width="160" height="74" rx="12" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1.2" />
    <text x="20" y="32" class="row-lbl">HÀNG 2 (i = 2)</text>
    <text x="20" y="52" font-family="system-ui" font-size="11" fill="#6EE7B7">Vòng ngoài lượt 3</text>

    <path d="M 160 37 L 180 37" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)" />

    <!-- 4 Cells -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="50" y="26" class="star-txt">★</text>
      <text x="50" y="52" class="cell-txt">(2, 0)</text>

      <rect x="115" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="165" y="26" class="star-txt">★</text>
      <text x="165" y="52" class="cell-txt">(2, 1)</text>

      <rect x="230" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="280" y="26" class="star-txt">★</text>
      <text x="280" y="52" class="cell-txt">(2, 2)</text>

      <rect x="345" y="0" width="100" height="74" rx="10" fill="url(#cellGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="395" y="26" class="star-txt">★</text>
      <text x="395" y="52" class="cell-txt">(2, 3)</text>

      <!-- Print Newline badge -->
      <path d="M 450 37 L 480 37" fill="none" stroke="#A855F7" stroke-width="2" />
      <rect x="485" y="22" width="115" height="30" rx="6" fill="#581C87" stroke="#A855F7" />
      <text x="542" y="37" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle" dominant-baseline="central">print() ↵</text>
    </g>
  </g>

  <!-- FORMULA FOOTER -->
  <g transform="translate(40, 395)">
    <rect width="820" height="70" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="30" y="30" font-family="system-ui" font-size="13" font-weight="700" fill="#F8FAFC">
      🎯 CÔNG THỨC VÀNG: Tổng số lần in dấu sao = (3 Hàng) × (4 Cột) = 12 dấu sao!
    </text>
    <text x="30" y="52" font-family="system-ui" font-size="12" font-weight="500" fill="#94A3B8">
      Lệnh <tspan fill="#38BDF8" font-family="'Fira Code', monospace">print('*', end=' ')</tspan> giữ con trỏ trên cùng 1 hàng. Lệnh <tspan fill="#C084FC" font-family="'Fira Code', monospace">print()</tspan> ở cuối vòng ngoài giúp nhảy xuống hàng mới!
    </text>
  </g>
</svg>

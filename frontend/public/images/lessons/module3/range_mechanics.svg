<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="rowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanNum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="emeraldNum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberNum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="purpleNum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .fn-code { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 700; fill: #38BDF8; }
    .num-txt { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .stop-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #F87171; text-anchor: middle; }
    .desc-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
  </style>

  <rect width="900" height="520" rx="24" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 38)">
    <text x="0" y="0" class="title">GIẢI MÃ HÀM MA THUẬT RANGE() TRONG PYTHON</text>
    <text x="0" y="24" class="subtitle">Quy tắc biên vàng: Luôn luôn dừng lại TRƯỚC giá trị Stop (Không bao giờ lấy Stop!)</text>
  </g>

  <!-- ROW 1: range(5) -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="820" height="88" rx="14" fill="url(#rowGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="36" class="fn-code" fill="#38BDF8">range(5)</text>
    <text x="24" y="58" class="desc-txt">1 Tham số: Tự động bắt đầu từ 0</text>
    
    <!-- Numbers: 0, 1, 2, 3, 4 -->
    <g transform="translate(240, 22)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="url(#cyanNum)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="22" y="22" class="num-txt">0</text>
      
      <rect x="56" y="0" width="44" height="44" rx="8" fill="url(#cyanNum)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="78" y="22" class="num-txt">1</text>
      
      <rect x="112" y="0" width="44" height="44" rx="8" fill="url(#cyanNum)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="134" y="22" class="num-txt">2</text>
      
      <rect x="168" y="0" width="44" height="44" rx="8" fill="url(#cyanNum)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="190" y="22" class="num-txt">3</text>
      
      <rect x="224" y="0" width="44" height="44" rx="8" fill="url(#cyanNum)" stroke="#38BDF8" stroke-width="1.2" />
      <text x="246" y="22" class="num-txt">4</text>
      
      <!-- Stop Wall -->
      <line x1="284" y1="-4" x2="284" y2="48" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 2" />
      <rect x="296" y="4" width="70" height="36" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#DC2626" stroke-width="1" />
      <text x="331" y="22" class="num-txt" fill="#FCA5A5" font-size="14">5 ⛔</text>
      <text x="331" y="54" class="stop-txt">BỊ CHẶN LẠI</text>
    </g>
  </g>

  <!-- ROW 2: range(1, 6) -->
  <g transform="translate(40, 185)" filter="url(#shadow)">
    <rect width="820" height="88" rx="14" fill="url(#rowGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="36" class="fn-code" fill="#34D399">range(1, 6)</text>
    <text x="24" y="58" class="desc-txt">2 Tham số: Bắt đầu từ 1 đến stop-1</text>
    
    <!-- Numbers: 1, 2, 3, 4, 5 -->
    <g transform="translate(240, 22)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="url(#emeraldNum)" stroke="#34D399" stroke-width="1.2" />
      <text x="22" y="22" class="num-txt">1</text>
      
      <rect x="56" y="0" width="44" height="44" rx="8" fill="url(#emeraldNum)" stroke="#34D399" stroke-width="1.2" />
      <text x="78" y="22" class="num-txt">2</text>
      
      <rect x="112" y="0" width="44" height="44" rx="8" fill="url(#emeraldNum)" stroke="#34D399" stroke-width="1.2" />
      <text x="134" y="22" class="num-txt">3</text>
      
      <rect x="168" y="0" width="44" height="44" rx="8" fill="url(#emeraldNum)" stroke="#34D399" stroke-width="1.2" />
      <text x="190" y="22" class="num-txt">4</text>
      
      <rect x="224" y="0" width="44" height="44" rx="8" fill="url(#emeraldNum)" stroke="#34D399" stroke-width="1.2" />
      <text x="246" y="22" class="num-txt">5</text>
      
      <!-- Stop Wall -->
      <line x1="284" y1="-4" x2="284" y2="48" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 2" />
      <rect x="296" y="4" width="70" height="36" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#DC2626" stroke-width="1" />
      <text x="331" y="22" class="num-txt" fill="#FCA5A5" font-size="14">6 ⛔</text>
      <text x="331" y="54" class="stop-txt">BỊ CHẶN LẠI</text>
    </g>
  </g>

  <!-- ROW 3: range(2, 11, 2) -->
  <g transform="translate(40, 285)" filter="url(#shadow)">
    <rect width="820" height="88" rx="14" fill="url(#rowGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="36" class="fn-code" fill="#FBBF24">range(2, 11, 2)</text>
    <text x="24" y="58" class="desc-txt">3 Tham số: Bước nhảy +2 (Số chẵn)</text>
    
    <!-- Numbers: 2, 4, 6, 8, 10 -->
    <g transform="translate(240, 22)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="url(#amberNum)" stroke="#FBBF24" stroke-width="1.2" />
      <text x="22" y="22" class="num-txt">2</text>
      
      <rect x="56" y="0" width="44" height="44" rx="8" fill="url(#amberNum)" stroke="#FBBF24" stroke-width="1.2" />
      <text x="78" y="22" class="num-txt">4</text>
      
      <rect x="112" y="0" width="44" height="44" rx="8" fill="url(#amberNum)" stroke="#FBBF24" stroke-width="1.2" />
      <text x="134" y="22" class="num-txt">6</text>
      
      <rect x="168" y="0" width="44" height="44" rx="8" fill="url(#amberNum)" stroke="#FBBF24" stroke-width="1.2" />
      <text x="190" y="22" class="num-txt">8</text>
      
      <rect x="224" y="0" width="44" height="44" rx="8" fill="url(#amberNum)" stroke="#FBBF24" stroke-width="1.2" />
      <text x="246" y="22" class="num-txt">10</text>
      
      <!-- Stop Wall -->
      <line x1="284" y1="-4" x2="284" y2="48" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 2" />
      <rect x="296" y="4" width="70" height="36" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#DC2626" stroke-width="1" />
      <text x="331" y="22" class="num-txt" fill="#FCA5A5" font-size="14">11 ⛔</text>
      <text x="331" y="54" class="stop-txt">BỊ CHẶN LẠI</text>
    </g>
  </g>

  <!-- ROW 4: range(5, 0, -1) -->
  <g transform="translate(40, 385)" filter="url(#shadow)">
    <rect width="820" height="88" rx="14" fill="url(#rowGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="36" class="fn-code" fill="#C084FC">range(5, 0, -1)</text>
    <text x="24" y="58" class="desc-txt">3 Tham số: Bước nhảy -1 (Đếm lùi)</text>
    
    <!-- Numbers: 5, 4, 3, 2, 1 -->
    <g transform="translate(240, 22)">
      <rect x="0" y="0" width="44" height="44" rx="8" fill="url(#purpleNum)" stroke="#C084FC" stroke-width="1.2" />
      <text x="22" y="22" class="num-txt">5</text>
      
      <rect x="56" y="0" width="44" height="44" rx="8" fill="url(#purpleNum)" stroke="#C084FC" stroke-width="1.2" />
      <text x="78" y="22" class="num-txt">4</text>
      
      <rect x="112" y="0" width="44" height="44" rx="8" fill="url(#purpleNum)" stroke="#C084FC" stroke-width="1.2" />
      <text x="134" y="22" class="num-txt">3</text>
      
      <rect x="168" y="0" width="44" height="44" rx="8" fill="url(#purpleNum)" stroke="#C084FC" stroke-width="1.2" />
      <text x="190" y="22" class="num-txt">2</text>
      
      <rect x="224" y="0" width="44" height="44" rx="8" fill="url(#purpleNum)" stroke="#C084FC" stroke-width="1.2" />
      <text x="246" y="22" class="num-txt">1</text>
      
      <!-- Stop Wall -->
      <line x1="284" y1="-4" x2="284" y2="48" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 2" />
      <rect x="296" y="4" width="70" height="36" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#DC2626" stroke-width="1" />
      <text x="331" y="22" class="num-txt" fill="#FCA5A5" font-size="14">0 ⛔</text>
      <text x="331" y="54" class="stop-txt">BỊ CHẶN LẠI</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="450" y="500" font-family="system-ui" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">
    💡 Muốn lặp lấy cả số N? ➔ Hãy luôn truyền vào điểm dừng là (N + 1)!
  </text>
</svg>
